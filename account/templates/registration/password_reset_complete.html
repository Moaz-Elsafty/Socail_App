{% extends "auth_base.html" %}

{% block title %}Password reset{% endblock %}

{% block auth_content %}
    <div class="auth-icon success">{% include "includes/icon.html" with name="check-circle" %}</div>
    <h1>Password updated</h1>
    <p>Your password has been set. You can log in with your new password now.</p>
    <a href="{% url 'login' %}" class="btn btn-lg btn-block">Log in</a>
{% endblock %}

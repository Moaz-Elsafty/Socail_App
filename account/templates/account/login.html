{% extends "auth_base.html" %}

{% block title %}Log in{% endblock %}

{% block auth_content %}
    <h1>Welcome back</h1>
    <p>Log in to continue to Bookmarks.</p>
    <form method="post" class="form">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-lg btn-block">Log in</button>
    </form>
    <p class="auth-foot">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
{% endblock %}

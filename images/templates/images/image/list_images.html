{% load thumbnail %}
{% for image in images %}
    <a class="image-card" href="{{ image.get_absolute_url }}">
        <div class="image-card-media">
            {% thumbnail image.image 480x480 crop="smart" as im %}
            <img src="{{ im.url }}" alt="{{ image.title }}" loading="lazy">
            <span class="image-card-cta">{% include "includes/icon.html" with name="eye" %} View</span>
        </div>
        <div class="image-card-info">
            <span class="image-card-title">{{ image.title }}</span>
            <span class="image-card-likes">{% include "includes/icon.html" with name="heart" %} {{ image.total_likes }}</span>
        </div>
    </a>
{% endfor %}
